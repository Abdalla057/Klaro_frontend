components:
  schemas:
    Abonnement:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        fournisseur:
          allOf:
          - $ref: '#/components/schemas/FournisseurAbonnementResume'
          readOnly: true
        plan:
          allOf:
          - $ref: '#/components/schemas/PlanAbonnement'
          readOnly: true
        date_debut:
          type: string
          format: date-time
          readOnly: true
        date_fin:
          type: string
          format: date-time
          readOnly: true
        statut:
          allOf:
          - $ref: '#/components/schemas/AbonnementStatutEnum'
          readOnly: true
        statut_effectif:
          type: string
          readOnly: true
        est_actif:
          type: boolean
          readOnly: true
        est_essai:
          type: boolean
          readOnly: true
        jours_restants:
          type: integer
          readOnly: true
        montant:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
          description: Montant facturé au moment de la souscription.
        devise:
          type: string
          readOnly: true
        reference_paiement:
          type: string
          readOnly: true
        notes:
          type: string
          readOnly: true
        cree_par:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            telephone:
              type: string
          readOnly: true
        date_creation:
          type: string
          format: date-time
          readOnly: true
        date_modification:
          type: string
          format: date-time
          readOnly: true
      required:
      - cree_par
      - date_creation
      - date_debut
      - date_fin
      - date_modification
      - devise
      - est_actif
      - est_essai
      - fournisseur
      - id
      - jours_restants
      - montant
      - notes
      - plan
      - reference_paiement
      - statut
      - statut_effectif
    AbonnementCreation:
      type: object
      properties:
        montant_paiement:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
          description: Montant réellement payé. Par défaut, le prix du plan.
        moyen_paiement:
          oneOf:
          - $ref: '#/components/schemas/MoyenPaiementEnum'
          - $ref: '#/components/schemas/BlankEnum'
        paiement_confirme:
          type: boolean
          default: false
          description: Comptabilise immédiatement le paiement dans le chiffre d'affaires.
        cle_idempotence:
          type: string
          description: Évite la création d'un doublon en cas de nouvel envoi.
          maxLength: 100
        fournisseur:
          type: integer
        plan:
          type: integer
        date_debut:
          type: string
          format: date-time
          nullable: true
        reference_paiement:
          type: string
          maxLength: 100
        notes:
          type: string
      required:
      - fournisseur
      - plan
    AbonnementResume:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        plan_nom:
          type: string
          readOnly: true
        statut:
          $ref: '#/components/schemas/AbonnementStatutEnum'
        statut_effectif:
          type: string
          readOnly: true
        est_actif:
          type: boolean
          readOnly: true
        est_essai:
          type: boolean
        date_debut:
          type: string
          format: date-time
        date_fin:
          type: string
          format: date-time
        jours_restants:
          type: integer
          readOnly: true
        montant:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Montant facturé au moment de la souscription.
        devise:
          type: string
          maxLength: 3
      required:
      - date_debut
      - date_fin
      - est_actif
      - id
      - jours_restants
      - plan_nom
      - statut_effectif
    AbonnementStatutEnum:
      enum:
      - ACTIF
      - EXPIRE
      - SUSPENDU
      - ANNULE
      type: string
      description: |-
        * `ACTIF` - Actif
        * `EXPIRE` - Expiré
        * `SUSPENDU` - Suspendu
        * `ANNULE` - Annulé
    ActivationParCode:
      type: object
      properties:
        telephone:
          type: string
        code:
          type: string
          pattern: ^\d{6}$
        password:
          type: string
          writeOnly: true
          minLength: 8
      required:
      - code
      - password
      - telephone
    Agent:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        utilisateur:
          type: integer
          readOnly: true
        fournisseur:
          type: integer
          readOnly: true
        nom:
          type: string
        prenom:
          type: string
        telephone:
          type: string
          readOnly: true
        zone:
          type: string
          description: Zone / secteur de travail
          maxLength: 255
        compte_active:
          type: boolean
          readOnly: true
          description: Passe à True après validation du code et définition du mot
            de passe.
        code_activation:
          type: string
          readOnly: true
        date_creation:
          type: string
          format: date-time
          readOnly: true
        date_activation:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - code_activation
      - compte_active
      - date_activation
      - date_creation
      - fournisseur
      - id
      - telephone
      - utilisateur
    AgentCreation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nom:
          type: string
          default: ''
        prenom:
          type: string
          default: ''
        telephone:
          type: string
          maxLength: 20
        zone:
          type: string
          description: Zone / secteur de travail
          maxLength: 255
        compte_active:
          type: boolean
          readOnly: true
          description: Passe à True après validation du code et définition du mot
            de passe.
        code_activation:
          type: string
          readOnly: true
        date_creation:
          type: string
          format: date-time
          readOnly: true
