components:
  schemas:
    Abonnement:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        fournisseur:
          allOf:
          - $ref: '#/components/schemas/FournisseurAbonnementResume'
          readOnly: true
        plan:
          allOf:
          - $ref: '#/components/schemas/PlanAbonnement'
          readOnly: true
        date_debut:
          type: string
          format: date-time
          readOnly: true
        date_fin:
          type: string
          format: date-time
          readOnly: true
        statut:
          allOf:
          - $ref: '#/components/schemas/AbonnementStatutEnum'
          readOnly: true
        statut_effectif:
          type: string
          readOnly: true
        est_actif:
          type: boolean
          readOnly: true
        est_essai:
          type: boolean
          readOnly: true
        jours_restants:
          type: integer
          readOnly: true
        montant:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
          description: Montant facturé au moment de la souscription.
        devise:
          type: string
          readOnly: true
        reference_paiement:
          type: string
          readOnly: true
        notes:
          type: string
          readOnly: true
        cree_par:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            telephone:
              type: string
          readOnly: true
        date_creation:
          type: string
          format: date-time
          readOnly: true
        date_modification:
          type: string
          format: date-time
          readOnly: true
      required:
      - cree_par
      - date_creation
      - date_debut
      - date_fin
      - date_modification
      - devise
      - est_actif
      - est_essai
      - fournisseur
      - id
      - jours_restants
      - montant
      - notes
      - plan
      - reference_paiement
      - statut
      - statut_effectif
    AbonnementCreation:
      type: object
      properties:
        fournisseur:
          type: integer
        plan:
          type: integer
        date_debut:
          type: string
          format: date-time
          nullable: true
        reference_paiement:
          type: string
          maxLength: 100
        notes:
          type: string
      required:
      - fournisseur
      - plan
    AbonnementResume:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        plan_nom:
          type: string
          readOnly: true
        statut:
          $ref: '#/components/schemas/AbonnementStatutEnum'
        statut_effectif:
          type: string
          readOnly: true
        est_actif:
          type: boolean
          readOnly: true
        est_essai:
          type: boolean
        date_debut:
          type: string
          format: date-time
        date_fin:
          type: string
          format: date-time
        jours_restants:
          type: integer
          readOnly: true
        montant:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Montant facturé au moment de la souscription.
        devise:
          type: string
          maxLength: 3
      required:
      - date_debut
      - date_fin
      - est_actif
      - id
      - jours_restants
      - plan_nom
      - statut_effectif
    AbonnementStatutEnum:
      enum:
      - ACTIF
      - EXPIRE
      - SUSPENDU
      - ANNULE
      type: string
      description: |-
        * `ACTIF` - Actif
        * `EXPIRE` - Expiré
        * `SUSPENDU` - Suspendu
        * `ANNULE` - Annulé
    Agent:
      type: object
      description: Utilisé pour la lecture et la mise à jour (pas la création).
      properties:
        id:
          type: integer
          readOnly: true
        utilisateur:
          type: integer
          readOnly: true
        fournisseur:
          type: integer
          readOnly: true
        telephone:
          type: string
          readOnly: true
        zone:
          type: string
          description: Zone / secteur de travail
          maxLength: 255
        compte_active:
          type: boolean
          readOnly: true
          description: Passe à True une fois le code SMS validé et le mot de passe
            défini.
        date_creation:
          type: string
          format: date-time
          readOnly: true
      required:
      - compte_active
      - date_creation
      - fournisseur
      - id
      - telephone
      - utilisateur
    AgentCreation:
      type: object
      description: |-
        Utilisé uniquement à la création : le fournisseur ajoute son agent en
        saisissant juste son numéro de téléphone (même principe que le client).
        Un compte Utilisateur est créé inactif, sans mot de passe, et un SMS avec
        un code d'activation à 6 chiffres est envoyé à ce numéro (l'agent
        choisira son mot de passe au moment de l'activation, voir
        AgentActivationSerializer).
      properties:
        id:
          type: integer
          readOnly: true
        telephone:
          type: string
          maxLength: 20
        zone:
          type: string
          description: Zone / secteur de travail
          maxLength: 255
        compte_active:
          type: boolean
          readOnly: true
          description: Passe à True une fois le code SMS validé et le mot de passe
            défini.
        date_creation:
          type: string
          format: date-time
          readOnly: true
      required:
      - compte_active
      - date_creation
      - id
      - telephone
    AnnulationAbonnement:
      type: object
      properties:
        motif:
          type: string
      required:
      - motif
    ChangementMotDePasse:
      type: object
      properties:
        ancien_mot_de_passe:
          type: string
          writeOnly: true
        nouveau_mot_de_passe:
          type: string
          writeOnly: true
          minLength: 8
        confirmation:
          type: string
          writeOnly: true
      required:
      - ancien_mot_de_passe
      - confirmation
      - nouveau_mot_de_passe
    Client:
      type: object
      description: Utilisé pour la lecture et la mise à jour (pas la création).
      properties:
        id:
          type: integer
          readOnly: true
        utilisateur:
          type: integer
          readOnly: true
        fournisseur:
          type: integer
          readOnly: true
        telephone:
          type: string
          readOnly: true
        adresse:
          type: string
          maxLength: 255
        solde_du:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        compte_active:
          type: boolean
          readOnly: true
          description: Passe à True une fois le code SMS validé et le mot de passe
            défini.
        date_creation:
          type: string
          format: date-time
          readOnly: true
      required:
      - compte_active
      - date_creation
      - fournisseur
      - id
      - solde_du
      - telephone
      - utilisateur
    ClientCreation:
      type: object
      description: |-
        Utilisé uniquement à la création : le fournisseur ajoute son client en
        saisissant juste son numéro de téléphone. Un compte Utilisateur est créé
        inactif, sans mot de passe, et un SMS avec un code d'activation à 6
        chiffres est envoyé à ce numéro (le client choisira son mot de passe au
        moment de l'activation, voir ClientActivationSerializer).
      properties:
        id:
          type: integer
          readOnly: true
        telephone:
          type: string
          maxLength: 20
        adresse:
          type: string
          maxLength: 255
        solde_du:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        compte_active:
          type: boolean
          readOnly: true
          description: Passe à True une fois le code SMS validé et le mot de passe
            défini.
        date_creation:
          type: string
          format: date-time
          readOnly: true
      required:
      - compte_active
      - date_creation
      - id
      - solde_du
      - telephone
